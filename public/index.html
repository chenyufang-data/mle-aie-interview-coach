<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLE/AIE Interview Coach</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell setup-shell">
      <section class="setup-page" aria-label="Interview setup">
        <div class="brand setup-brand">
          <div class="logo-mark">IC</div>
          <div>
            <p class="eyebrow">Interview Coach</p>
            <h1>MLE/AIE practice</h1>
          </div>
        </div>

        <div class="setup-grid">
          <section class="setup-card">
            <div class="section-heading">
              <p class="eyebrow">Setup</p>
              <h2>Choose your interview topic</h2>
            </div>

            <div class="field">
              <label>Track</label>
              <div class="segmented" role="group" aria-label="Role track">
                <button class="segment active" data-role="MLE" type="button">MLE</button>
                <button class="segment" data-role="AIE" type="button">AIE</button>
              </div>
            </div>

            <div class="field">
              <label for="level">Level</label>
              <select id="level">
                <option>Entry-level</option>
                <option selected>Mid-level</option>
                <option>Senior</option>
                <option>Staff</option>
              </select>
            </div>

            <div class="field">
              <label for="topic">Topic</label>
              <select id="topic"></select>
            </div>

            <div class="field">
              <label for="focus">Optional focus</label>
              <input id="focus" type="text" placeholder="e.g. fraud ranking, RAG latency">
            </div>

            <div class="field">
              <label for="accessKey">Access key (optional)</label>
              <div class="key-input-row">
                <input id="accessKey" type="password" placeholder="Paid key for Claude grading" autocomplete="off">
                <span id="keyStatus" class="key-status" aria-live="polite" hidden></span>
              </div>
              <p id="tierBadge" class="inline-status" hidden></p>
            </div>

            <button id="startBtn" class="primary-action" type="button">Start</button>
            <p id="setupStatus" class="inline-status" aria-live="polite"></p>
          </section>

          <section class="preview-panel" aria-label="Selected session summary">
            <div class="section-heading">
              <p class="eyebrow">Session</p>
              <h2 id="sessionTitle">MLE Mid-level</h2>
            </div>
            <dl class="session-list">
              <div>
                <dt>Track and level</dt>
                <dd id="summaryTrack">MLE Mid-level</dd>
              </div>
              <div>
                <dt>Topic</dt>
                <dd id="summaryTopic">ML system design</dd>
              </div>
              <div>
                <dt>Focus</dt>
                <dd id="summaryFocus">General</dd>
              </div>
            </dl>
          </section>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
