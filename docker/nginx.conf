# Per-client rate limit for the API: 10 requests/second sustained, a burst
# of 20 served immediately, anything beyond answered with 429. The zone is
# keyed by client address (16 MB holds about 256k addresses).
limit_req_zone $binary_remote_addr zone=api:16m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Behind the Caddy TLS terminator (docker-compose.prod.yml) every
    # connection arrives from the Caddy container, so trust the private
    # docker networks for X-Forwarded-For and key the rate limit on the
    # real client. real_ip_recursive takes the rightmost address that is
    # not trusted, i.e. the one Caddy appended, never a spoofed one.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are base64 JSON (resume/JD files, one answer clip); the
    # backend enforces its own per-route caps (1 MB default, 16 MB resume
    # upload, 48 MB answer clip - coach/http.py BODY_LIMITS) below this.
    client_max_body_size 48m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Claude grading with extended thinking can take over a minute;
        # nginx's 60s default would cut the evaluation off mid-request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live voice loop (coach/voice, WebSocket on backend:8765). The page
    # dials ws(s)://<this host>/ws/voice when the backend publishes
    # VOICE_WS_PATH=/ws/voice, so one origin and one TLS certificate cover
    # the HTTP API and the socket. A session is one long-lived connection.
    location /ws/voice {
        proxy_pass http://backend:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
        # Always revalidate: without this, browsers cache heuristically and
        # keep showing pages from before an image rebuild. Unchanged files
        # still answer with a cheap 304 via the ETag.
        add_header Cache-Control "no-cache";
    }
}
