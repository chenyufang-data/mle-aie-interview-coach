name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The bge-small embedding model (~127 MB) downloads once per cache key.
      - uses: actions/cache@v4
        with:
          path: data/models/fastembed
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}
      # Retrieval quality gate: 23 curated cases, fails below 90% Recall@5 -
      # on BM25 (the fallback) and on the shipped hybrid retriever.
      - run: python tests/test_retrieval.py
      - run: python tests/test_retrieval.py --backend hybrid
      # Dense/hybrid arms, offline: filter parity with BM25, RRF math,
      # ranking contracts (fake embedder, no model download).
      - run: python tests/test_dense_retrieval.py
      # Distilled grader artifact: ordering invariants on probe answers.
      - run: python tests/test_grader.py
      # STT experiment text layer: normalization, WER, term error rate,
      # post-hoc correction audit, keyterm policy (pure Python).
      - run: python tests/test_stt_text.py
      # Mock interview: phase machine, turn protocol, metrics, full offline
      # flow on the fake engine (roles -> plan -> turns -> report).
      - run: python tests/test_mock.py
      # rag_exp ingest, pure parsing/dedupe/chunk helpers on synthetic
      # fixtures (no spreadsheets, no private bank needed).
      - run: python tests/test_ingest.py
      # Voice loop, deterministic parts: endpointer state machine, sentence
      # chunker, keyterm policy, SSE parsing, two-transcript report block.
      - run: python tests/test_voice.py
