name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres for the state store's second backend (tests/test_store.py):
    # the same image the compose override runs, so the pgvector extension
    # is there too.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-db.txt
      # The bge-small embedding model (~127 MB) downloads once per cache key.
      - uses: actions/cache@v4
        with:
          path: data/models/fastembed
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}
      # Retrieval quality gate: 23 curated cases, fails below 90% Recall@5 -
      # on BM25 (the fallback) and on the shipped hybrid retriever.
      - run: python tests/test_retrieval.py
      - run: python tests/test_retrieval.py --backend hybrid
      # Dense/hybrid arms, offline: filter parity with BM25, RRF math,
      # ranking contracts (fake embedder, no model download).
      - run: python tests/test_dense_retrieval.py
      # Distilled grader artifact: ordering invariants on probe answers.
      - run: python tests/test_grader.py
      # STT experiment text layer: normalization, WER, term error rate,
      # post-hoc correction audit, keyterm policy (pure Python).
      - run: python tests/test_stt_text.py
      # Mock interview: phase machine, turn protocol, metrics, full offline
      # flow on the fake engine (roles -> plan -> turns -> report).
      - run: python tests/test_mock.py
      # rag_exp ingest, pure parsing/dedupe/chunk helpers on synthetic
      # fixtures (no spreadsheets, no private bank needed).
      - run: python tests/test_ingest.py
      # rag_lists ingest (GitHub lists): parsing, tier selection, module
      # routing, question-vs-question dedupe, chunk assembly - synthetic.
      - run: python tests/test_ingest_lists.py
      # Lesson-text expansion (plan §12.2 item 1): excerpt grounding, dedupe,
      # child ids, chunk assembly, parent selection - synthetic private bank.
      - run: python tests/test_expand_chunks.py
      # The HTML converter needs lxml (requirements-tools.txt, tools only).
      - run: pip install -r requirements-tools.txt
      - name: "ingest_docs (offline: converters, slicing, header, chunk assembly)"
        run: python tests/test_ingest_docs.py
      # Voice loop, deterministic parts: endpointer state machine, sentence
      # chunker, keyterm policy, SSE parsing, two-transcript report block.
      - run: python tests/test_voice.py
      # R4 author spot-check tooling: stratified sampling, blind page,
      # agreement math, idempotent report section (synthetic pool).
      - run: python tests/test_grounding_r4_spotcheck.py
      # Tier budgets, quota degradation, the mock engine gate, the request
      # body cap and the anonymous-LLM refusal (offline, no key).
      - run: python tests/test_users.py
      # Step 3 SLM grader experiment, shared pieces: chunk-grouped split and
      # dev fold, prompt, digit-token grade decode, metrics vs train.py's,
      # the pre-registered rule (synthetic rows; private-data check skips).
      - run: python tests/test_slm.py
      # State store (step 4): the file backend's contract and race, then
      # the same contract, the whole tier/budget suite and the migration
      # tool against the Postgres service above.
      - run: python tests/test_store.py
        env:
          TEST_DATABASE_URL: postgresql://coach:coach@localhost:5432/coach
      # README result tables must match the committed results files
      # (tools/render_readme.py renders them; --check fails on drift).
      - run: python tools/render_readme.py --check

  # Docker packaging: builds both images, boots the stack in --mock mode
  # (no API key), checks /api/meta through nginx (public banks present,
  # rag_exp absent, hybrid retrieval live after the model download) and
  # one graded answer, then tears everything down.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test_container.sh
      # The same stack with the Postgres override (docker-compose.db.yml):
      # /api/meta must report the postgres store and grading still works.
      - run: CONTAINER_TEST_DB=1 bash tests/test_container.sh
