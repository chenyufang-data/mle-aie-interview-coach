services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    # Default is real Claude grading (needs ANTHROPIC_API_KEY in .env).
    # For the free offline ML grader instead, uncomment:
    # command: ["python", "server.py", "--mock"]
    env_file:
      - path: .env
        required: false # not needed in --mock mode
    environment:
      HOST: 0.0.0.0
      REAL_SESSIONS_PATH: /data/sessions/real_sessions.jsonl
      FREE_SESSIONS_PATH: /data/sessions/free_sessions.jsonl
      USAGE_PATH: /data/usage.json
    volumes:
      # Practice history and quota state survive container rebuilds
      # (same layout as the local data/ folder - see data/README.md).
      - coach-data:/data
      # Freemium tiers: comment this out (or delete users.json) to disable —
      # without it, every request grades with Claude (single-user setup).
      - ./users.json:/app/users.json:ro
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/meta', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  coach-data:
