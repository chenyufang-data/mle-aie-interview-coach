services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    # Default is real Claude grading (needs ANTHROPIC_API_KEY in .env).
    # For the free offline ML grader instead, uncomment:
    # command: ["python", "server.py", "--mock"]
    env_file:
      - path: .env
        required: false # not needed in --mock mode
    environment:
      HOST: 0.0.0.0
      REAL_SESSIONS_PATH: /data/sessions/real_sessions.jsonl
      FREE_SESSIONS_PATH: /data/sessions/free_sessions.jsonl
      # The opt-in mock log and the resume-analysis cache belong on the
      # volume too (before 2026-09-10 they lived inside the container and
      # vanished on every rebuild).
      MOCK_SESSIONS_PATH: /data/sessions/mock_sessions.jsonl
      MOCK_CACHE_DIR: /data/mock_cache
      USAGE_PATH: /data/usage.json
      # The bge-small embedding model (~127 MB, downloaded once) and the
      # document-vector cache live on the volume, so an image rebuild never
      # re-downloads or re-embeds (retrieval_dense.py reads both).
      FASTEMBED_CACHE_DIR: /data/models/fastembed
      RETRIEVAL_INDEX_DIR: /data/index
      # Silero VAD for the live voice loop (2.3 MB, downloaded once) - the
      # loop runs when the .env sets a cloud AUDIO_BACKEND (deepgram) and
      # its key; docs/deployment.md section 6.
      SILERO_VAD_PATH: /data/models/silero_vad.onnx
    volumes:
      # Practice history and quota state survive container rebuilds
      # (same layout as the local data/ folder - see data/README.md).
      - coach-data:/data
      # Freemium tiers: comment this out (or delete users.json) to disable —
      # without it, every request grades with Claude (single-user setup).
      - ./users.json:/app/users.json:ro
    expose:
      - "8000"
      # Voice-loop WebSocket (nginx proxies /ws/voice here; it listens when
      # the .env names a cloud audio backend the image can run - see
      # requirements-voice-cloud.txt - otherwise /ws/voice answers 502).
      - "8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/meta', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  coach-data:
